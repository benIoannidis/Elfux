[package]
name = "sys_tools"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.9"
libc = "0.2"
nix = { version = "0.28", features = ["signal"] }
tar = "0.4.46"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0

[[bin]]
name = "poweroff"
path = "src/poweroff.rs"

[[bin]]
name = "reboot"
path = "src/reboot.rs"

[[bin]]
name = "elfetch"
path = "src/elfetch.rs"

[[bin]]
name = "elfpkg"
path = "src/elfpkg.rs"
